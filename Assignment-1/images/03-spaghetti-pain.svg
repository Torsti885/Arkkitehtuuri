<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Sama sääntö kolmessa paikassa">
  <rect width="960" height="400" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Sama sääntö kolmessa paikassa</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="40" y="80" width="280" height="200" rx="10" fill="#fff1ee" stroke="#c1121f" stroke-width="2"/>
  <text x="56" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">RecordResult()</text>
  <text x="56" y="132" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">hae ottelu</text>
  <text x="56" y="152" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">onko tulos jo?</text>
  <text x="56" y="172" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">onko ajankohta ohi?</text>
  <rect x="340" y="80" width="280" height="200" rx="10" fill="#fff1ee" stroke="#c1121f" stroke-width="2"/>
  <text x="356" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">GetStandings()</text>
  <text x="356" y="132" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">hae ottelut</text>
  <text x="356" y="152" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">laske pisteet</text>
  <text x="356" y="172" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">ohita perutut?</text>
  <rect x="640" y="80" width="280" height="200" rx="10" fill="#fff1ee" stroke="#c1121f" stroke-width="2"/>
  <text x="656" y="108" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">CancelMatch()</text>
  <text x="656" y="132" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">hae ottelu</text>
  <text x="656" y="152" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">onko alkanut?</text>
  <text x="656" y="172" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">onko tulos?</text>
  <text x="40" y="330" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#c1121f">Asiakas: perua saa vain ennen alkua. Kolme korjauspaikkaa.</text>
</svg>
