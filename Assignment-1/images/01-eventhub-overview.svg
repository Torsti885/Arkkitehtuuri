<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Mitä rakennamme: LeagueHub">
  <rect width="960" height="400" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Mitä rakennamme: LeagueHub</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="280" height="200" rx="10" fill="#1d3557" stroke="#1d3557" stroke-width="2"/>
  <text x="56" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">Joukkueet</text>
  <text x="56" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Nimi, kaupunki, maxRoster</text>
  <text x="56" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">GET/POST /api/teams</text>
  <rect x="340" y="70" width="280" height="200" rx="10" fill="#457b9d" stroke="#457b9d" stroke-width="2"/>
  <text x="356" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">Ottelut</text>
  <text x="356" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Koti, vieras, ajankohta</text>
  <text x="356" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Tulos kerran</text>
  <text x="356" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">POST .../result</text>
  <rect x="640" y="70" width="280" height="200" rx="10" fill="#e07a5f" stroke="#9b2226" stroke-width="2"/>
  <text x="656" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">Säännöt</text>
  <text x="656" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Kaksi eri joukkuetta</text>
  <text x="656" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Tulos vain jos ohi</text>
  <text x="656" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Ei toista tulosta</text>
  <text x="40" y="310" font-family="Segoe UI, Calibri, sans-serif" font-size="15" fill="#1d3557">Sama tuote koko kurssin: ensin API, myöhemmin Clean Architecture, CQRS ja selain.</text>
  <text x="40" y="340" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#457b9d">Sarjataulukko lasketaan otteluista — siksi säännöt eivät saa hajota controllereihin.</text>
</svg>
