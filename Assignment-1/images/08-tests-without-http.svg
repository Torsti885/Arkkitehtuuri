<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-label="Sääntötesti ilman HTTP:tä">
  <rect width="960" height="400" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Sääntötesti ilman HTTP:tä</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="400" height="250" rx="10" fill="#fff1ee" stroke="#c1121f" stroke-width="2"/>
  <text x="56" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">Spagetti — ei onnistu</text>
  <text x="56" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Sääntö on IActionResultissa</text>
  <text x="56" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Data private static -listassa</text>
  <text x="56" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Testi vaatisi HTTP:n</text>
  <text x="56" y="182" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Testit sotkevat toistensa datan</text>
  <rect x="520" y="70" width="400" height="250" rx="10" fill="#e9f5f3" stroke="#2a9d8f" stroke-width="2"/>
  <text x="536" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#1d3557" font-weight="700">Kerrokset — onnistuu</text>
  <text x="536" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">MatchService on tavallinen luokka</text>
  <text x="536" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">Fake toteuttaa IMatchRepositoryn</text>
  <text x="536" y="162" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">new MatchService(fakes)</text>
  <text x="536" y="182" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#1d3557">dotnet test, ei porttia</text>
</svg>
