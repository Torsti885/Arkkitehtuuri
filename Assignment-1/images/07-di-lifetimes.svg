  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">DI-elinkaaret LeagueHubissa</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="40" y="70" width="430" height="180" rx="10" fill="#1d3557" stroke="#1d3557" stroke-width="2"/>
  <text x="56" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">Singleton — repositoryt</text>
  <text x="56" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Yksi olio koko ajan.</text>
  <text x="56" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Data elää muistissa.</text>
  <rect x="490" y="70" width="430" height="180" rx="10" fill="#457b9d" stroke="#457b9d" stroke-width="2"/>
  <text x="506" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">Scoped — servicet</text>
  <text x="506" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Uusi olio per HTTP-pyyntö.</text>
  <text x="506" y="142" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Kerralla 2 DbContext on Scoped.</text>
  <text x="40" y="290" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Kokeile: vaihda repositoryt AddScoped ja kirjaa tulos. Seuraava GET on tyhjä — uusi lista.</text>
