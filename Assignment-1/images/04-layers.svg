<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Kerrosarkkitehtuuri: yksi vastuu per kerros">
  <rect width="960" height="500" fill="#f7f5f2"/>
  <text x="24" y="36" font-family="Segoe UI, Calibri, sans-serif" font-size="20" font-weight="700" fill="#1d3557">Kerrosarkkitehtuuri: yksi vastuu per kerros</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d3557"/>
    </marker>
  </defs>

  <rect x="80" y="70" width="800" height="100" rx="10" fill="#1d3557" stroke="#1d3557" stroke-width="2"/>
  <text x="96" y="98" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">PRESENTATION  —  Controllers/</text>
  <text x="96" y="122" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">HTTP sisään, statuskoodit ulos. Ei sääntöjä.</text>
  <line x1="480" y1="170" x2="480" y2="196" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="200" width="800" height="100" rx="10" fill="#457b9d" stroke="#457b9d" stroke-width="2"/>
  <text x="96" y="228" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">BUSINESS  —  Services/</text>
  <text x="96" y="252" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Säännöt ja sarjataulukon laskenta. Ei HTTP:tä, ei listoja.</text>
  <line x1="480" y1="300" x2="480" y2="326" stroke="#1d3557" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="80" y="330" width="800" height="100" rx="10" fill="#2a9d8f" stroke="#1d3557" stroke-width="2"/>
  <text x="96" y="358" font-family="Segoe UI, Calibri, sans-serif" font-size="16" fill="#ffffff" font-weight="700">DATA  —  Repositories/</text>
  <text x="96" y="382" font-family="Segoe UI, Calibri, sans-serif" font-size="13" fill="#ffffff">Haku ja tallennus. Nyt lista, kerralla 2 tietokanta.</text>
  <text x="80" y="460" font-family="Segoe UI, Calibri, sans-serif" font-size="14" fill="#1d3557">Riippuvuudet vain alaspäin. Kytkentä rajapinnoilla (IMatchRepository).</text>
</svg>
